<!DOCTYPE html>
<html lang="ja">
<head>
<base target="_top">
<meta charset="utf-8">
<style>
:root{--bg:#f5f6f8;--card:#fff;--ink:#1d2330;--sub:#6b7280;--line:#e3e6eb;--acc:#2563eb;--acc-ink:#fff;--red:#c62828;--org:#c25e00;--grn:#2e7d32;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d2128;--ink:#e8eaee;--sub:#9aa3af;--line:#2c323b;--acc:#5b8cff;--acc-ink:#0b0d10;--red:#ff6b6b;--org:#ffa94d;--grn:#69db7c;--chip:#272c35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP","Yu Gothic UI",sans-serif;-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 6px;border-bottom:1px solid var(--line)}
.row{display:flex;gap:8px;align-items:center}
h1{font-size:18px;margin:0;flex:1}
button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:7px 12px;cursor:pointer;min-height:36px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.ghost{border-color:transparent;background:transparent}
button:disabled{opacity:.5}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-height:38px}
textarea{min-height:90px;resize:vertical}
.quick{margin-top:8px}
.quick input{flex:1}
.tools{margin-top:8px;flex-wrap:wrap}
.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:8px;padding-bottom:2px;scrollbar-width:none}
.tab{border-radius:999px;padding:5px 12px;white-space:nowrap;min-height:32px;font-size:14px}
.tab.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tab .n{opacity:.7;margin-left:4px}
main{padding:10px 16px 80px;max-width:820px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:flex;gap:10px;align-items:flex-start}
.card .chk{width:22px;height:22px;min-height:22px;margin-top:2px;flex:none;accent-color:var(--acc)}
.card .body{flex:1;min-width:0;cursor:pointer}
.card .t{font-weight:600;word-break:break-word}
.card.done .t{text-decoration:line-through;color:var(--sub)}
.meta{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:4px;font-size:12px;color:var(--sub)}
.chip{background:var(--chip);border-radius:6px;padding:1px 6px}
.chip.red{color:var(--red);font-weight:600}
.chip.org{color:var(--org);font-weight:600}
.chip.hi{color:var(--red)}
.acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.acts button{min-height:32px;padding:4px 10px;font-size:13px}
.sec{font-size:13px;color:var(--sub);margin:14px 2px 6px;font-weight:600}
.empty{color:var(--sub);text-align:center;padding:40px 0}
.status{font-size:12px;color:var(--sub);margin-top:6px}
.status .err{color:var(--red)}
dialog{border:none;border-radius:12px;padding:0;width:min(560px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg h2{font-size:16px;margin:0 0 10px}
.f{margin-bottom:10px}
.f label{display:block;font-size:12px;color:var(--sub);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.foot{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.cand{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:6px}
.cand .row input[type=checkbox]{width:20px;min-height:20px;flex:none}
.cand .grid3{display:grid;grid-template-columns:1fr 90px;gap:6px;margin-top:6px}
.hint{font-size:12px;color:var(--sub)}
pre.tpl{white-space:pre-wrap;background:var(--chip);border-radius:8px;padding:8px;font-size:12px;margin:6px 0}
a{color:var(--acc)}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
#toast.on{opacity:1}
@media (max-width:480px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>TaskHub</h1>
    <button id="btnIngest" title="Gmail を今すぐ取り込む">✉ 取込</button>
    <button id="btnReload" class="ghost" title="再読み込み">↻</button>
  </div>
  <form id="quick" class="row quick" autocomplete="off">
    <input id="quickText" placeholder="新しいタスク（例: 見積作成 @金曜 !高 #案件A）" aria-label="新しいタスク">
    <button class="pri" type="submit">追加</button>
  </form>
  <div class="row tools">
    <button id="btnPhone">📞 電話メモ</button>
    <button id="btnImport">📋 AI・メモ取込</button>
    <button id="btnNew">＋ 詳細入力</button>
    <input id="search" placeholder="検索" style="flex:1;min-width:120px" aria-label="検索">
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="status" id="status"></div>
</header>
<main id="list"><div class="empty">読み込み中…</div></main>

<dialog id="dlgEdit"><form class="dlg" method="dialog" id="formEdit">
  <h2 id="editTitle">タスク</h2>
  <div class="f"><label>タイトル</label><input name="title" required maxlength="200"></div>
  <div class="grid2">
    <div class="f"><label>期限</label><input name="due" type="date"></div>
    <div class="f"><label>優先度</label><select name="priority"><option>高</option><option selected>中</option><option>低</option></select></div>
    <div class="f"><label>状態</label><select name="status"></select></div>
    <div class="f"><label>出典</label><select name="source"></select></div>
    <div class="f"><label>依頼者</label><input name="requester" maxlength="200"></div>
    <div class="f"><label>連絡先</label><input name="contact" maxlength="200"></div>
  </div>
  <div class="f"><label>タグ（スペース区切り）</label><input name="tags" maxlength="200"></div>
  <div class="f"><label>詳細・メモ</label><textarea name="detail" maxlength="5000"></textarea></div>
  <div class="hint" id="editSrc"></div>
  <div class="foot">
    <button type="button" class="ghost" data-close>キャンセル</button>
    <button type="submit" class="pri">保存</button>
  </div>
</form></dialog>

<dialog id="dlgPhone"><form class="dlg" method="dialog" id="formPhone">
  <h2>📞 電話メモ</h2>
  <div class="grid2">
    <div class="f"><label>相手（会社・氏名）</label><input name="requester" required maxlength="200"></div>
    <div class="f"><label>連絡先</label><input name="contact" inputmode="tel" maxlength="200"></div>
  </div>
  <div class="f"><label>用件</label><textarea name="body" required maxlength="4000" placeholder="例: 来週水曜までに見積の再送をしてほしい"></textarea></div>
  <div class="grid2">
    <div class="f"><label>期限（空なら用件から自動判定）</label><input name="due" type="date"></div>
    <div class="f"><label>優先度</label><select name="priority"><option>高</option><option selected>中</option><option>低</option></select></div>
  </div>
  <div class="f"><label><input type="checkbox" name="callback" style="width:auto;min-height:auto"> 折り返し電話が必要</label></div>
  <div class="foot">
    <button type="button" class="ghost" data-close>キャンセル</button>
    <button type="submit" class="pri">登録</button>
  </div>
</form></dialog>

<dialog id="dlgImport"><div class="dlg">
  <h2>📋 AI・メモから取込</h2>
  <div class="f"><label>出典</label><select id="impSource"><option>Claude</option><option>ChatGPT</option><option>AI(その他)</option><option>メモ</option><option>NIコラボ</option><option>その他</option></select></div>
  <div class="f"><label>貼り付け（箇条書きなら1行1件。文章なら AI/ルールで抽出）</label><textarea id="impText" style="min-height:140px"></textarea></div>
  <details class="hint"><summary>AI に頼むときの定型文（コピーして Claude / ChatGPT に送る）</summary>
    <pre class="tpl" id="tpl"></pre><button type="button" id="btnCopyTpl">定型文をコピー</button>
  </details>
  <div id="impCands"></div>
  <div class="foot">
    <button type="button" class="ghost" data-close>閉じる</button>
    <button type="button" id="btnParse">解析</button>
    <button type="button" id="btnImpInbox" disabled>未整理へ</button>
    <button type="button" id="btnImpTodo" class="pri" disabled>タスクに登録</button>
  </div>
</div></dialog>

<div id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var STATUS = ['未整理', '未着手', '進行中', '待ち', '完了', '却下'];
  var SOURCES = ['手入力', '電話', 'Gmail', 'NIコラボ', 'Claude', 'ChatGPT', 'AI(その他)', 'メモ', 'その他'];
  var ACTIVE = { '未着手': 1, '進行中': 1, '待ち': 1 };
  var S = { tasks: [], today: '', tab: 'today', q: '', boot: null, cands: [] };
  try { S.tab = localStorage.getItem('th_tab') || 'today'; } catch (e) {}

  var $ = function (id) { return document.getElementById(id); };

  /** DOM 生成。文字列は必ず textContent で入れる（HTML として解釈しない＝XSS 対策） */
  function h(tag, attrs) {
    var el = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') el.className = v;
      else if (k === 'text') el.textContent = v;
      else if (k.slice(0, 2) === 'on') el.addEventListener(k.slice(2), v);
      else if (k === 'href') { if (/^https:\/\//.test(v)) el.setAttribute('href', v); }
      else el.setAttribute(k, v === true ? '' : v);
    });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c === null || c === undefined || c === false) continue;
      el.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return el;
  }

  function call(fn) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
      r[fn].apply(r, args);
    });
  }

  var toastTimer;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove('on'); }, 2500);
  }
  function fail(e) { toast('エラー: ' + (e && e.message ? e.message : e)); }

  function upsert(t) {
    for (var i = 0; i < S.tasks.length; i++) if (S.tasks[i].id === t.id) { S.tasks[i] = t; return; }
    S.tasks.push(t);
  }

  // ---------- 一覧 ----------
  var TABS = [
    ['inbox', '未整理'], ['today', '今日'], ['plan', '予定'], ['waiting', '待ち'], ['all', 'すべて'], ['done', '完了']
  ];
  function inTab(t, tab) {
    var today = S.today;
    if (tab === 'inbox') return t.status === '未整理';
    if (tab === 'today') return (t.status === '未着手' || t.status === '進行中') && ((t.due && t.due <= today) || t.status === '進行中');
    if (tab === 'plan') return (t.status === '未着手' || t.status === '進行中') && !(t.due && t.due <= today) && t.status !== '進行中';
    if (tab === 'waiting') return t.status === '待ち';
    if (tab === 'all') return !!ACTIVE[t.status];
    if (tab === 'done') return t.status === '完了' || t.status === '却下';
    return false;
  }
  function matchQ(t) {
    if (!S.q) return true;
    var s = (t.title + ' ' + t.detail + ' ' + t.requester + ' ' + t.tags + ' ' + t.source).toLowerCase();
    return S.q.toLowerCase().split(/\s+/).every(function (w) { return s.indexOf(w) >= 0; });
  }
  var PRI = { '高': 0, '中': 1, '低': 2 };
  function cmp(a, b) {
    var ad = a.due || '9999-99-99', bd = b.due || '9999-99-99';
    if (ad !== bd) return ad < bd ? -1 : 1;
    if (PRI[a.priority] !== PRI[b.priority]) return PRI[a.priority] - PRI[b.priority];
    return a.createdAt < b.createdAt ? -1 : 1;
  }

  function renderTabs() {
    var nav = $('tabs'); nav.textContent = '';
    TABS.forEach(function (tb) {
      var n = tb[0] === 'done' ? '' : String(S.tasks.filter(function (t) { return inTab(t, tb[0]); }).length);
      nav.appendChild(h('button', {
        class: 'tab' + (S.tab === tb[0] ? ' on' : ''), type: 'button',
        onclick: function () { S.tab = tb[0]; try { localStorage.setItem('th_tab', S.tab); } catch (e) {} render(); }
      }, tb[1], n ? h('span', { class: 'n', text: n }) : null));
    });
  }

  function render() {
    renderTabs();
    var list = $('list'); list.textContent = '';
    var items = S.tasks.filter(function (t) { return inTab(t, S.tab) && matchQ(t); });
    if (S.tab === 'done') items.sort(function (a, b) { return (b.doneAt || b.updatedAt) < (a.doneAt || a.updatedAt) ? -1 : 1; }).splice(100);
    else if (S.tab === 'inbox') items.sort(function (a, b) { return a.createdAt < b.createdAt ? 1 : -1; });
    else items.sort(cmp);
    if (!items.length) {
      list.appendChild(h('div', { class: 'empty', text: S.tab === 'inbox' ? '未整理のタスクはありません 🎉' : '該当するタスクはありません' }));
      return;
    }
    var lastSec = null;
    items.forEach(function (t) {
      var sec = section(t);
      if (sec && sec !== lastSec) { list.appendChild(h('div', { class: 'sec', text: sec })); lastSec = sec; }
      list.appendChild(card(t));
    });
  }

  function section(t) {
    if (S.tab === 'today') return t.due && t.due < S.today ? '期限切れ' : t.due === S.today ? '今日' : '進行中';
    if (S.tab === 'plan') {
      if (!t.due) return '期限なし';
      var d = daysFromToday(t.due);
      return d <= 7 ? '1週間以内' : d <= 31 ? '1か月以内' : 'それ以降';
    }
    return null;
  }
  function daysFromToday(s) {
    var a = s.split('-'), b = S.today.split('-');
    return Math.round((Date.UTC(+a[0], a[1] - 1, +a[2]) - Date.UTC(+b[0], b[1] - 1, +b[2])) / 86400000);
  }
  function dueChip(t) {
    if (!t.due) return null;
    var d = daysFromToday(t.due);
    var wd = '日月火水木金土'.charAt(new Date(t.due + 'T00:00:00').getDay());
    var label = t.due.slice(5).replace('-', '/') + '(' + wd + ')';
    var done = t.status === '完了' || t.status === '却下';
    if (!done && d < 0) return h('span', { class: 'chip red', text: '期限切れ ' + label });
    if (!done && d === 0) return h('span', { class: 'chip org', text: '今日 ' + label });
    if (!done && d === 1) return h('span', { class: 'chip org', text: '明日 ' + label });
    return h('span', { class: 'chip', text: label });
  }

  function card(t) {
    var done = t.status === '完了' || t.status === '却下';
    var chk = t.status === '未整理' ? null : h('input', {
      type: 'checkbox', class: 'chk', 'aria-label': '完了', checked: t.status === '完了',
      onchange: function (e) { setStatus(t, e.target.checked ? '完了' : '未着手'); }
    });
    var meta = h('div', { class: 'meta' },
      dueChip(t),
      t.priority === '高' ? h('span', { class: 'chip hi', text: '優先:高' }) : t.priority === '低' ? h('span', { class: 'chip', text: '優先:低' }) : null,
      t.status !== '未着手' && t.status !== '未整理' && t.status !== '完了' ? h('span', { class: 'chip', text: t.status }) : null,
      h('span', { class: 'chip', text: t.source || '-' }),
      t.requester ? h('span', { text: t.requester }) : null,
      t.tags ? h('span', { text: t.tags.split(/\s+/).map(function (x) { return '#' + x; }).join(' ') }) : null
    );
    var body = h('div', { class: 'body', onclick: function () { openEdit(t); } }, h('div', { class: 't', text: t.title }), meta);
    if (t.status === '未整理') {
      body.appendChild(h('div', { class: 'acts' },
        h('button', { type: 'button', class: 'pri', onclick: function (e) { e.stopPropagation(); setStatus(t, '未着手'); } }, '採用'),
        h('button', { type: 'button', onclick: function (e) { e.stopPropagation(); openEdit(t, '未着手'); } }, '編集して採用'),
        h('button', { type: 'button', onclick: function (e) { e.stopPropagation(); setStatus(t, '待ち'); } }, '待ちにする'),
        h('button', { type: 'button', class: 'ghost', onclick: function (e) { e.stopPropagation(); setStatus(t, '却下'); } }, '却下'),
        t.sourceUrl ? h('a', { href: t.sourceUrl, target: '_blank', rel: 'noopener noreferrer', onclick: function (e) { e.stopPropagation(); } }, '元メール') : null
      ));
    } else if (t.status === '却下') {
      body.appendChild(h('div', { class: 'acts' },
        h('button', { type: 'button', onclick: function (e) { e.stopPropagation(); setStatus(t, '未整理'); } }, '未整理に戻す')));
    }
    return h('div', { class: 'card' + (done ? ' done' : '') }, chk, body);
  }

  function setStatus(t, status) {
    var prev = t.status;
    t.status = status; render();
    call('apiUpdate', t.id, { status: status }).then(function (r) {
      upsert(r); render();
      toast(status === '完了' ? '完了にしました' : status === '却下' ? '却下しました' : '「' + status + '」にしました');
    }).catch(function (e) { t.status = prev; render(); fail(e); });
  }

  // ---------- 編集 ----------
  var editing = null, editForceStatus = null;
  function fillSelect(sel, opts) { sel.textContent = ''; opts.forEach(function (o) { sel.appendChild(h('option', { text: o, value: o })); }); }
  function openEdit(t, forceStatus) {
    editing = t; editForceStatus = forceStatus || null;
    var f = $('formEdit');
    fillSelect(f.status, STATUS); fillSelect(f.source, SOURCES);
    $('editTitle').textContent = t ? (forceStatus ? '編集して採用' : 'タスクの編集') : '新しいタスク';
    f.title.value = t ? t.title : '';
    f.due.value = t ? t.due : '';
    f.priority.value = t ? t.priority : '中';
    f.status.value = forceStatus || (t ? t.status : '未着手');
    f.source.value = t ? (SOURCES.indexOf(t.source) >= 0 ? t.source : 'その他') : '手入力';
    f.requester.value = t ? t.requester : '';
    f.contact.value = t ? t.contact : '';
    f.tags.value = t ? t.tags : '';
    f.detail.value = t ? t.detail : '';
    var src = $('editSrc'); src.textContent = '';
    if (t) {
      src.appendChild(document.createTextNode('作成 ' + t.createdAt + (t.account ? ' / ' + t.account : '') + ' '));
      if (t.sourceUrl) src.appendChild(h('a', { href: t.sourceUrl, target: '_blank', rel: 'noopener noreferrer' }, '元メールを開く'));
    }
    $('dlgEdit').showModal();
    if (!t) setTimeout(function () { f.title.focus(); }, 50);
  }
  $('formEdit').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var data = {
      title: f.title.value, due: f.due.value, priority: f.priority.value, status: f.status.value,
      source: f.source.value, requester: f.requester.value, contact: f.contact.value, tags: f.tags.value, detail: f.detail.value
    };
    var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    var p = editing ? call('apiUpdate', editing.id, data) : call('apiCreate', data);
    p.then(function (r) { upsert(r); $('dlgEdit').close(); render(); toast('保存しました'); })
      .catch(fail).then(function () { btn.disabled = false; });
  });

  // ---------- クイック追加 ----------
  $('quick').addEventListener('submit', function (e) {
    e.preventDefault();
    var inp = $('quickText'), v = inp.value.trim();
    if (!v) return;
    inp.disabled = true;
    call('apiQuickAdd', v).then(function (r) {
      upsert(r); inp.value = ''; render();
      toast('追加しました' + (r.due ? '（期限 ' + r.due + '）' : ''));
    }).catch(fail).then(function () { inp.disabled = false; inp.focus(); });
  });

  // ---------- 電話メモ ----------
  $('btnPhone').onclick = function () { $('formPhone').reset(); $('dlgPhone').showModal(); };
  $('formPhone').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = e.target;
    var body = f.body.value.trim();
    var first = body.split('\n')[0].slice(0, 40);
    var data = {
      title: '【電話】' + f.requester.value.trim() + '：' + first + (f.callback.checked ? '（折返し要）' : ''),
      detail: body + (f.callback.checked ? '\n\n※折り返し電話が必要' : '') + '\n\n受付: ' + new Date().toLocaleString('ja-JP'),
      due: f.due.value, priority: f.priority.value, status: '未着手', source: '電話',
      requester: f.requester.value, contact: f.contact.value, tags: f.callback.checked ? '折返し' : ''
    };
    var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
    var go = function (d) {
      return call('apiCreate', d).then(function (r) { upsert(r); $('dlgPhone').close(); render(); toast('電話メモを登録しました'); });
    };
    // 期限が空なら用件から自動判定
    (data.due ? go(data) : call('apiParseText', '- ' + body.replace(/\n/g, ' '), '電話').then(function (res) {
      var c = res.tasks[0]; if (c && c.due) data.due = c.due;
      if (c && c.priority === '高' && data.priority === '中') data.priority = '高';
      return go(data);
    })).catch(fail).then(function () { btn.disabled = false; });
  });

  // ---------- AI・メモ取込 ----------
  function tplText() {
    return 'この会話（または以下の文章）から、私がやるべきタスクだけを抽出してください。\n' +
      '出力は次の形式で1行1件、説明文は不要です。\n' +
      '- タスク名（動詞で終わる具体的な行動） @期限(yyyy-mm-dd・不明なら省略) !優先度(高/中/低) #案件名\n' +
      '今日は ' + S.today + ' です。相対的な日付は具体的な日付に直してください。';
  }
  $('btnImport').onclick = function () {
    $('tpl').textContent = tplText();
    S.cands = []; renderCands();
    $('dlgImport').showModal();
  };
  $('btnCopyTpl').onclick = function () {
    var txt = tplText();
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject())
      .then(function () { toast('コピーしました'); })
      .catch(function () { toast('コピーできませんでした。手動で選択してください'); });
  };
  $('btnParse').onclick = function () {
    var txt = $('impText').value;
    if (!txt.trim()) return toast('テキストを貼り付けてください');
    var b = $('btnParse'); b.disabled = true; b.textContent = '解析中…';
    call('apiParseText', txt, $('impSource').value).then(function (res) {
      S.cands = res.tasks.map(function (t) { t._on = true; return t; });
      renderCands();
      toast(S.cands.length + ' 件の候補（' + (res.method === 'gemini' ? 'AI' : 'ルール') + '）');
    }).catch(fail).then(function () { b.disabled = false; b.textContent = '解析'; });
  };
  function renderCands() {
    var box = $('impCands'); box.textContent = '';
    S.cands.forEach(function (c) {
      box.appendChild(h('div', { class: 'cand' },
        h('div', { class: 'row' },
          h('input', { type: 'checkbox', checked: c._on, onchange: function (e) { c._on = e.target.checked; } }),
          h('input', { value: c.title, oninput: function (e) { c.title = e.target.value; }, 'aria-label': 'タイトル' })),
        h('div', { class: 'grid3' },
          h('input', { type: 'date', value: c.due || '', onchange: function (e) { c.due = e.target.value; }, 'aria-label': '期限' }),
          (function () {
            var s = h('select', { onchange: function (e) { c.priority = e.target.value; }, 'aria-label': '優先度' });
            ['高', '中', '低'].forEach(function (p) { s.appendChild(h('option', { value: p, text: p, selected: c.priority === p })); });
            return s;
          })())
      ));
    });
    $('btnImpInbox').disabled = $('btnImpTodo').disabled = !S.cands.length;
  }
  function commitCands(status) {
    var list = S.cands.filter(function (c) { return c._on && String(c.title).trim(); }).map(function (c) {
      return { title: c.title, detail: c.detail || '', due: c.due || '', priority: c.priority || '中', tags: c.tags || '', requester: c.requester || '', source: $('impSource').value };
    });
    if (!list.length) return toast('登録する候補がありません');
    call('apiCreateMany', list, status).then(function (rs) {
      rs.forEach(upsert); $('impText').value = ''; S.cands = []; renderCands();
      $('dlgImport').close(); render(); toast(rs.length + ' 件登録しました');
    }).catch(fail);
  }
  $('btnImpInbox').onclick = function () { commitCands('未整理'); };
  $('btnImpTodo').onclick = function () { commitCands('未着手'); };

  // ---------- その他 ----------
  $('btnNew').onclick = function () { openEdit(null); };
  $('btnReload').onclick = load;
  $('btnIngest').onclick = function () {
    var b = $('btnIngest'); b.disabled = true; b.textContent = '取込中…';
    call('apiIngestNow').then(function (st) {
      if (st && st.busy) toast('別の取込が実行中です。少し待ってから再読み込みしてください');
      else toast('Gmail 取込: 新規 ' + (st.created || 0) + ' 件');
      return load();
    }).catch(fail).then(function () { b.disabled = false; b.textContent = '✉ 取込'; });
  };
  $('search').addEventListener('input', function (e) { S.q = e.target.value.trim(); render(); });
  Array.prototype.forEach.call(document.querySelectorAll('[data-close]'), function (b) {
    b.addEventListener('click', function () { b.closest('dialog').close(); });
  });

  function renderStatus() {
    var st = $('status'); st.textContent = '';
    var b = S.boot; if (!b) return;
    var parts = ['AI: ' + (b.aiMode === 'gemini' ? 'Gemini' : 'ルール')];
    if (b.lastIngest) parts.push('前回取込 ' + String(b.lastIngest.at).slice(5, 16));
    parts.push('転送先: ' + b.plus);
    st.appendChild(document.createTextNode(parts.join(' ・ ')));
    if (b.errors && b.errors.length) st.appendChild(h('span', { class: 'err', text: ' ・ 24時間以内のエラー ' + b.errors.length + ' 件（シート「ログ」）' }));
  }

  function load() {
    return call('apiBootstrap').then(function (b) {
      S.boot = b; S.tasks = b.tasks; S.today = b.today;
      renderStatus(); render();
    }).catch(function (e) {
      $('list').textContent = '';
      $('list').appendChild(h('div', { class: 'empty', text: '読み込みに失敗しました: ' + (e && e.message ? e.message : e) }));
    });
  }
  load();
  // 画面に戻ったとき（スマホでアプリ切替後など）に再読み込み
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'visible' && S.boot) load();
  });
})();
</script>
</body>
</html>
